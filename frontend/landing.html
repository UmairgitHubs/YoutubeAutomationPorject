<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Puzmania</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect rx='8' fill='%237C3AED' width='32' height='32'/%3E%3Ctext x='8' y='23' font-family='Arial' font-size='18' font-weight='700' fill='%23FFE14A'%3EP%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/play.css?v=5" />
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <span class="sun"></span>
      <span class="cloud cloud-a"></span>
      <span class="cloud cloud-b"></span>
      <span class="cloud cloud-c"></span>
      <span class="hill"></span>
    </div>
    <header class="top">
      <p class="logo">Puzmania</p>
      <h1>Pick one</h1>
    </header>

    <main class="trio" id="trio" aria-live="polite"></main>
    <p class="board-err" id="board-err" hidden></p>

    <button type="button" class="admin-link" id="admin-open">administrator login</button>

    <dialog class="stage" id="stage" aria-label="Puzzle">
      <div class="stage-body">
        <div class="stage-video-wrap">
          <video id="stage-video" controls playsinline></video>
          <button type="button" class="back" id="stage-back">Back</button>
        </div>
        <aside class="stage-side">
          <p class="stage-name" id="stage-name"></p>
          <p class="question" id="stage-question"></p>
          <div class="letters" id="letters"></div>
          <p class="stage-msg" id="stage-msg" hidden></p>
          <button type="button" class="ok" id="stage-ok" hidden>OK</button>
        </aside>
      </div>
    </dialog>

    <dialog class="admin" id="admin-box" aria-label="Administrator login">
      <form id="admin-form">
        <label>Name <input name="username" autocomplete="username" required /></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required /></label>
        <p id="admin-err" hidden></p>
        <button type="submit">Go</button>
      </form>
      <button type="button" class="admin-back" id="admin-back">Back</button>
    </dialog>

    <script src="/js/play.js?v=5"></script>
  </body>
</html>
